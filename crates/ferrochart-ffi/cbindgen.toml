# Header of the C ABI: cbindgen --config cbindgen.toml --output include/ferrochart.h
# (run from this directory; scripts/check.sh checks that it is up to date).
language = "C"
style = "both"
cpp_compat = true
include_guard = "FERROCHART_H"
documentation = true
documentation_style = "c99"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
header = """/*
 * FerroChart C API. Generated by cbindgen from crates/ferrochart-ffi; do not edit.
 *
 * Functions return FERROCHART_OK (0) or a negative FERROCHART_ERR_* code;
 * ferrochart_last_error() describes the last failure on the calling thread.
 * Structs start with a `size` field: set it to sizeof(struct) before passing
 * a struct in either direction. Ids are uint64_t, times UTC milliseconds,
 * sizes CSS pixels, colors 0xRRGGBBAA. A chart is not thread-safe.
 */"""

[export]
include = ["FerroChartOptions", "FerroChartSeriesOptions", "FerroChartInput", "FerroChartInputResult", "FerroChartEvent", "FerroChartWindow", "FerroChartMarker"]

[export.rename]

[parse]
parse_deps = false

[const]
allow_static_const = false
