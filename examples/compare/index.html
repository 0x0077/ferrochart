<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FerroChart — library comparison</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #131722; color: #d1d4dc;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #2a2e39; }
    select, button { background: #1e222d; color: inherit; border: 1px solid #363a45; border-radius: 4px;
      padding: 3px 8px; font: inherit; }
    #status { color: #9598a1; font-variant-numeric: tabular-nums; }
    /* Every library gets the same box. */
    #stage { position: relative; flex: 1; min-height: 0; }
    #stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <!-- Script-tag builds of the other libraries (npm install in this directory). -->
  <script src="./node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script src="./node_modules/@luxalgo/vela/dist/vela.global.min.js"></script>
</head>
<body>
  <header>
    <strong>Comparison</strong>
    <label>Library
      <select id="lib">
        <option value="ferrochart">FerroChart</option>
        <option value="lightweight-charts">lightweight-charts</option>
        <option value="vela">Vela</option>
      </select>
    </label>
    <label>Bars
      <select id="bars">
        <option value="100000">100 k</option>
        <option value="1000000" selected>1 M</option>
      </select>
    </label>
    <button id="load">Load</button>
    <button id="run">Run pan/zoom script</button>
    <span id="status"></span>
  </header>
  <div id="stage"></div>
  <script type="module" src="./compare.js"></script>
</body>
</html>
