[package]
name = "example-egui"
description = "FerroChart egui integration example"
version.workspace = true
edition.workspace = true
# egui 0.36+ (the releases on wgpu 30) needs Rust 1.95; examples are not
# published, so the workspace MSRV check skips this one.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ferrochart-core = { workspace = true, features = ["testing"] }
ferrochart-indicators.workspace = true
ferrochart-render-wgpu.workspace = true
# egui with the wgpu renderer only (re-exports egui, egui_wgpu and wgpu).
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }

[lints]
workspace = true
