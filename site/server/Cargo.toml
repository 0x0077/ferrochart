[package]
name = "ferrochart-site-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Backend of ferrochart.com: serves the static site and synthetic market data for the chart examples"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "compression-br", "cors", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Not part of the engine workspace (repository root): the site's backend
# has its own dependencies and lock file.
[workspace]

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
